<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Memory Game</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light text-center">
  <div class="container py-4">
    <h1 class="mb-4 display-5 fw-bold text-primary">Pokémon Memory Game</h1>

    <div id="controls" class="mb-3 d-flex justify-content-center flex-wrap gap-2">
      <select id="difficulty" class="form-select w-auto">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="start" class="btn btn-success">Start Game</button>
      <button id="reset" class="btn btn-danger">Reset</button>
      <button id="theme-toggle" class="btn btn-primary">Toggle Theme</button>
      <button id="power-up" class="btn btn-warning">Power Up</button>
    </div>

    <div id="status-header" class="fs-5 mb-3 fw-medium"></div>
    <div id="game-board" class="mx-auto"></div>
  </div>

  <!-- Win/Lose Popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-content text-center">
      <h2 id="popup-message" class="mb-3 fw-bold"></h2>
      <button id="popup-close" class="btn btn-primary">Play Again</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
